name: Build DramaRush APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Configure Supabase environment
        env:
          SUPABASE_URL_1: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          SUPABASE_URL_2: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY_1: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_KEY_2: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          SUPABASE_URL="$SUPABASE_URL_1"

          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL="$SUPABASE_URL_2"
          fi

          SUPABASE_KEY="$SUPABASE_KEY_1"

          if [ -z "$SUPABASE_KEY" ]; then
            SUPABASE_KEY="$SUPABASE_KEY_2"
          fi

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: Supabase URL secret is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: Supabase anon key secret is missing."
            exit 1
          fi

          {
            echo "EXPO_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
            echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_KEY"
          } > .env

          echo "Supabase environment configured successfully."

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Check Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "ERROR: EXPO_TOKEN secret is missing."
            exit 1
          fi

          echo "Expo token is configured."

      - name: Configure EAS project
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas init \
            --account pyouri \
            --non-interactive

      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            export EXPO_PUBLIC_SUPABASE_URL="$SUPABASE_URL"
          fi

          if [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            export EXPO_PUBLIC_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          fi

          eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output ./DramaRush.apk

      - name: Verify APK
        run: |
          if [ ! -f "./DramaRush.apk" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          ls -lh ./DramaRush.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DramaRush-APK
          path: ./DramaRush.apk
          if-no-files-found: error

      - name: Remove temporary environment file
        if: always()
        run: rm -f .env
