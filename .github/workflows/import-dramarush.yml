name: Import DramaRush ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find ZIP file
        id: find_zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "DramaRush-GitHub-Ready.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found."
            exit 1
          fi

          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          ZIP_FILE="${{ steps.find_zip.outputs.zip_file }}"

          mkdir -p .imported
          unzip -o "$ZIP_FILE" -d .imported

          echo "Extracted files:"
          find .imported -maxdepth 3 -type f | head -100

      - name: Detect project root
        shell: bash
        run: |
          SOURCE=".imported"

          if [ -d ".imported/DramaRush" ]; then
            SOURCE=".imported/DramaRush"
          fi

          echo "SOURCE=$SOURCE" >> "$GITHUB_ENV"

      - name: Copy project to repository root
        shell: bash
        run: |
          rsync -av \
            --exclude=".git/" \
            --exclude=".github/" \
            "$SOURCE/" \
            "./"

      - name: Remove temporary files and ZIP
        shell: bash
        run: |
          rm -rf .imported
          rm -f "DramaRush-GitHub-Ready.zip"

      - name: Commit imported project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Import DramaRush project"
          git push
